name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: |
          xcodebuild test \
            -project NotesV.xcodeproj \
            -scheme NotesV \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      # These steps only run once the Developer ID secrets are added to the repository.
      - name: Import the Developer ID certificate
        if: ${{ secrets.DEVELOPER_ID_IDENTITY != '' }}
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build the release
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: Config/build-release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_NOTARIZED: ${{ secrets.DEVELOPER_ID_IDENTITY != '' }}
        run: |
          if [ "$IS_NOTARIZED" = "true" ]; then
            flags=()
            notes="Download the .dmg, open it and drag NotesV to Applications."
          else
            flags=(--prerelease)
            notes="This build isn't notarized by Apple, so macOS blocks it on first launch. See the Download section in the README for how to open it."
          fi
          gh release create "$GITHUB_REF_NAME" build/release/*.dmg build/release/*.sha256 \
            --title "NotesV ${GITHUB_REF_NAME#v}" --notes "$notes" "${flags[@]}"
